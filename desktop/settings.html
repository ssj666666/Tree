<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Tree 设置</title>
<style>
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; margin: 20px; color: #222; }
  h1 { font-size: 16px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  .row { margin-top: 18px; text-align: right; }
  button { padding: 8px 18px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button.primary { background: #16a34a; color: #fff; border-color: #16a34a; margin-left: 8px; }
  #msg { margin-top: 12px; font-size: 13px; color: #16a34a; min-height: 18px; }
  a { color: #16a34a; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
<h1>Tree 设置</h1>
<label for="serverUrl">服务器地址</label>
<input id="serverUrl" type="text" spellcheck="false" />
<div class="hint">Tree 服务器的地址。默认是你的阿里云服务器，一般不用改。</div>

<label for="hotkey">全局快捷键（显示 / 隐藏窗口）</label>
<input id="hotkey" type="text" spellcheck="false" />
<div class="hint">例如 Ctrl+Alt+T。写成“按键+按键”的形式，中间用 + 连接。</div>

<div class="row">
  <a id="openFile">直接打开配置文件</a>
  <button id="cancel">取消</button>
  <button id="save" class="primary">保存</button>
</div>
<div id="msg"></div>

<script>
  const $ = (id) => document.getElementById(id);
  window.treeSettings.get().then((cfg) => {
    $('serverUrl').value = cfg.serverUrl || '';
    $('hotkey').value = cfg.hotkey || '';
  });
  $('cancel').onclick = () => window.close();
  $('openFile').onclick = () => window.treeSettings.openConfigFile();
  $('save').onclick = async () => {
    const serverUrl = $('serverUrl').value.trim();
    const hotkey = $('hotkey').value.trim();
    if (!/^https?:\/\/.+/.test(serverUrl)) {
      $('msg').style.color = '#dc2626';
      $('msg').textContent = '服务器地址要以 http:// 或 https:// 开头。';
      return;
    }
    if (!hotkey.includes('+')) {
      $('msg').style.color = '#dc2626';
      $('msg').textContent = '快捷键请写成“按键 + 按键”的形式，例如 Ctrl+Alt+T。';
      return;
    }
    const r = await window.treeSettings.save({ serverUrl, hotkey });
    if (r && r.ok) {
      $('msg').style.color = '#16a34a';
      $('msg').textContent = '已保存。已切换到新的服务器地址，需要重新登录。';
      setTimeout(() => window.close(), 1200);
    }
  };
</script>
</body>
</html>
